<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fronteo 3D — Showcase Aislado</title>
  <meta name="description" content="Visor 3D aislado del objeto tipográfico Fronteo con marco editorial.">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Outer Viewport Layout with Margins */
    .viewport-container {
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      padding: clamp(1.2rem, 3vw, 2.5rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Top Navigation Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-shrink: 0;
      z-index: 10;
    }

    .top-bar a,
    .top-bar span {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: clamp(0.75rem, 0.85vw, 0.82rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #FFFFFF;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: #FFFF00;
    }

    .meta-badge {
      color: #8E8E8E !important;
    }

    /* Framed 3D Animation Box */
    .animation-frame {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background-color: #050505;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Corner Accents on Frame */
    .frame-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      pointer-events: none;
      z-index: 5;
    }

    .frame-corner-tl {
      top: -1px;
      left: -1px;
      border-top: 2px solid #FFFFFF;
      border-left: 2px solid #FFFFFF;
    }

    .frame-corner-tr {
      top: -1px;
      right: -1px;
      border-top: 2px solid #FFFFFF;
      border-right: 2px solid #FFFFFF;
    }

    .frame-corner-bl {
      bottom: -1px;
      left: -1px;
      border-bottom: 2px solid #FFFFFF;
      border-left: 2px solid #FFFFFF;
    }

    .frame-corner-br {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid #FFFFFF;
      border-right: 2px solid #FFFFFF;
    }

    /* 3D Canvas Stage inside Frame */
    #fronteo-3d-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
    }

    #fronteo-3d-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: transparent !important;
    }

    /* Bottom Info Bar */
    .bottom-bar {
      width: 100%;
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: clamp(0.65rem, 0.75vw, 0.72rem);
      color: #666666;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="viewport-container">

    <!-- Top Bar -->
    <header class="top-bar">
      <a href="projects/project-01.html">&larr; VOLVER AL PROYECTO</a>
      <span class="meta-badge">FRONTEO 3D — FRAMED VIEW</span>
    </header>

    <!-- Marco de la Animación 3D -->
    <main class="animation-frame">
      <!-- Esquinas técnicas -->
      <span class="frame-corner frame-corner-tl" aria-hidden="true"></span>
      <span class="frame-corner frame-corner-tr" aria-hidden="true"></span>
      <span class="frame-corner frame-corner-bl" aria-hidden="true"></span>
      <span class="frame-corner frame-corner-br" aria-hidden="true"></span>

      <!-- 3D Wrapper & Canvas -->
      <div id="fronteo-3d-wrapper">
        <canvas id="fronteo-3d-canvas"></canvas>
      </div>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottom-bar">
      <span>THREE.JS WEBGL RENDERER</span>
      <span>AUTONOMOUS PERSPECTIVE 3D</span>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="js/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="js/fronteo3d.js?v=framed"></script>
</body>

</html>
