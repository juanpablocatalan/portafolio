<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juan Pablo — Designer &amp; Art Director | ¡Próximamente!</title>
  <meta name="description"
    content="Portafolio de Juan Pablo — Editorial design, visual identities, and contemporary digital experiences. ¡Próximamente!">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/happy-face.svg">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-locked">

  <!-- Permanent Top-Left Statement Header -->
  <header class="site-header-static" id="site-header-static">
    <div class="container header-static-inner">
      <span class="static-header-label"><span class="header-name-light">juan-pablo</span>*<span class="header-name-bold">catalán</span></span>
    </div>
  </header>

  <!-- Main Static Stage (100vh locked on Desktop) -->
  <main class="home-main container" id="main-content">
    <div class="home-stage">

      <!-- Left Column: Interactive 3D Smiley Hero Stage -->
      <section class="stage-left" aria-label="Escenario visual 3D">
        <div class="smiley-3d-wrapper" id="smiley-3d-wrapper" aria-hidden="true">
          <canvas id="smiley-3d-canvas"></canvas>
        </div>
      </section>

      <!-- Right Column: Coming Soon Statement & Contact Drawer -->
      <aside class="stage-right" aria-label="Información">
        <div class="comingsoon-block">
          <span class="comingsoon-tag">PORTAFOLIO</span>
          <h1 class="comingsoon-title">¡próximamente!</h1>
          <p class="comingsoon-subtitle">DISEÑO EDITORIAL, IDENTIDADES VISUALES Y EXPERIENCIAS DIGITALES CONTEMPORÁNEAS.</p>
        </div>

        <!-- Bottom Navigation / Contact -->
        <nav class="project-list-footer" aria-label="Contacto">
          <div class="contact-button-wrapper">
            <button type="button" class="stage-footer-link contact-trigger-btn" id="contact-trigger"
              aria-expanded="false" aria-controls="contact-drawer">CONTACTO</button>

            <!-- Expandable Contact Options Drawer -->
            <div class="contact-drawer" id="contact-drawer" aria-hidden="true">
              <div class="contact-drawer-inner">
                <a href="mailto:juan-pablo.catalan@uc.cl" class="contact-sublink">EMAIL</a>
                <a href="https://www.linkedin.com/in/jp-catalan/" target="_blank" rel="noopener noreferrer"
                  class="contact-sublink">LINKED IN</a>
                <a href="https://www.instagram.com/jp.catalan/" target="_blank" rel="noopener noreferrer"
                  class="contact-sublink">INSTAGRAM</a>
              </div>
            </div>
          </div>
        </nav>
      </aside>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">JUAN-PABLO CATALÁN</span>
      <span class="footer-copy">&copy; 2026</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="js/smiley3d.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
